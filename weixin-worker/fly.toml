app = "xpilot-weixin-worker"
primary_region = "sin"

[build]

[experimental]
  enable_tun = true

[[services]]
  protocol = "udp"
  internal_port = 41641

  [[services.ports]]
    port = 41641

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
